<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4e8"/>
      <stop offset="45%" stop-color="#ffe8f0"/>
      <stop offset="100%" stop-color="#e8f0ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>

  <!-- 大圆盘 -->
  <circle cx="600" cy="315" r="190" fill="#fff" opacity="0.55"/>
  <circle cx="600" cy="315" r="190" fill="none" stroke="#39c5bb" stroke-opacity="0.3" stroke-width="2"/>

  <!-- 渐变扇形 -->
  <g opacity="0.75">
    <path d="M600 315 L600 125 A190 190 0 0 1 764.5 220 Z" fill="#39c5bb"/>
    <path d="M600 315 L764.5 220 A190 190 0 0 1 764.5 410 Z" fill="#7fd8d0"/>
    <path d="M600 315 L764.5 410 A190 190 0 0 1 600 505 Z" fill="#f7bfd6"/>
    <path d="M600 315 L600 505 A190 190 0 0 1 435.5 410 Z" fill="#f0aac6"/>
    <path d="M600 315 L435.5 410 A190 190 0 0 1 435.5 220 Z" fill="#bfe9ff"/>
    <path d="M600 315 L435.5 220 A190 190 0 0 1 600 125 Z" fill="#d9c9f5"/>
  </g>

  <!-- 同心圆 -->
  <circle cx="600" cy="315" r="120" fill="#fff" opacity="0.8"/>
  <circle cx="600" cy="315" r="60" fill="#fff" opacity="0.9"/>
  <circle cx="600" cy="315" r="16" fill="#39c5bb"/>

  <!-- 外圈刻度 -->
  <g stroke="#5b6470" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <path d="M600 100 L600 118"/>
    <path d="M600 512 L600 530"/>
    <path d="M385 315 L403 315"/>
    <path d="M797 315 L815 315"/>
