<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f7ff"/>
      <stop offset="50%" stop-color="#f3e9ff"/>
      <stop offset="100%" stop-color="#ffe9f3"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#d9f4ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#b8e8ff" stop-opacity="0.18"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 漂浮气泡 -->
  <circle cx="180" cy="180" r="86" fill="url(#bubble)" stroke="#9fd9f0" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="420" cy="110" r="46" fill="url(#bubble)" stroke="#9fd9f0" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="330" cy="420" r="62" fill="url(#bubble)" stroke="#c9b3ec" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="900" cy="160" r="104" fill="url(#bubble)" stroke="#c9b3ec" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="1080" cy="380" r="70" fill="url(#bubble)" stroke="#9fd9f0" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="700" cy="480" r="38" fill="url(#bubble)" stroke="#f0aac6" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="600" cy="240" r="54" fill="url(#bubble)" stroke="#9fd9f0" stroke-opacity="0.4" stroke-width="2"/>

  <!-- 高光 -->
  <ellipse cx="150" cy="150" rx="26" ry="16" fill="#fff" opacity="0.85" transform="rotate(-30 150 150)"/>
  <ellipse cx="872" cy="122" rx="32" ry="19" fill="#fff" opacity="0.85" transform="rotate(-30 872 122)"/>
  <ellipse cx="308" cy="398" rx="18" ry="11" fill="#fff" opacity="0.8" transform="rotate(-30 308 398)"/>

  <!-- 星点 -->
  <g fill="#ffd166" opacity="0.9">
    <path d="M1010 96 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
    <path d="M250 540 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
